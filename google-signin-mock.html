<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in - Google Accounts</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1f1f1f;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      width: 450px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      text-align: center;
    }
    .google-logo {
      height: 32px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 8px 0;
    }
    p.subtitle {
      font-size: 16px;
      color: #444746;
      margin: 0 0 32px 0;
    }
    .account-list {
      text-align: left;
      margin-bottom: 24px;
    }
    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e3e3e3;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 8px;
    }
    .account-item:hover {
      background: #f2f2f2;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
      background: #ddd;
    }
    .info {
      display: flex;
      flex-direction: column;
    }
    .name {
      font-size: 14px;
      font-weight: 500;
      color: #1f1f1f;
    }
    .email {
      font-size: 12px;
      color: #444746;
    }
    .btn-use-other {
      display: inline-flex;
      align-items: center;
      background: none;
      border: none;
      color: #0b57d0;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .btn-use-other:hover {
      background: #f2f2f2;
    }
    .other-form {
      display: none;
      text-align: left;
      margin-top: 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444746;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #747775;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #0b57d0;
      border-width: 2px;
      padding: 11px;
    }
    .btn-submit {
      background: #0b57d0;
      color: white;
      border: none;
      border-radius: 100px;
      padding: 12px 24px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    .btn-submit:hover {
      background: #0842a0;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="google-logo" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    <h1>Choose an account</h1>
    <p class="subtitle">to continue to <strong>Pastelly</strong></p>

    <div class="account-list" id="account-list">
      <div class="account-item" onclick="selectAccount('Cozy Creator', 'cozy.creator@gmail.com', 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=50&q=80')">
        <img class="avatar" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=50&q=80" alt="Cozy Creator">
        <div class="info">
          <span class="name">Cozy Creator</span>
          <span class="email">cozy.creator@gmail.com</span>
        </div>
      </div>
      <div class="account-item" onclick="selectAccount('Pastelly Designer', 'pastelly.user@gmail.com', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=50&q=80')">
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=50&q=80" alt="Pastelly Designer">
        <div class="info">
          <span class="name">Pastelly Designer</span>
          <span class="email">pastelly.user@gmail.com</span>
        </div>
      </div>
      <div class="account-item" onclick="selectAccount('Soft Aesthetic', 'aesthetic.designer@gmail.com', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=50&q=80')">
        <img class="avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=50&q=80" alt="Soft Aesthetic">
        <div class="info">
          <span class="name">Soft Aesthetic</span>
          <span class="email">aesthetic.designer@gmail.com</span>
        </div>
      </div>
    </div>

    <button class="btn-use-other" id="btn-show-other" onclick="showOtherForm()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:12px; color:#444746;">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <line x1="19" y1="8" x2="19" y2="14"></line>
        <line x1="22" y1="11" x2="16" y2="11"></line>
      </svg>
      Use another account
    </button>

    <div class="other-form" id="other-form">
      <form onsubmit="submitCustom(event)">
        <div class="form-group">
          <label for="custom-name">Your Full Name</label>
          <input type="text" id="custom-name" required placeholder="Elena Rostova">
        </div>
        <div class="form-group">
          <label for="custom-email">Google Email Address</label>
          <input type="email" id="custom-email" required placeholder="name@gmail.com">
        </div>
        <button type="submit" class="btn-submit">Sign in</button>
      </form>
    </div>
  </div>

  <script>
    function selectAccount(name, email, avatar) {
      if (window.opener) {
        window.opener.postMessage({
          type: 'GOOGLE_SIGNIN_SUCCESS',
          user: { name, email, avatar }
        }, '*');
      }
      window.close();
    }

    function showOtherForm() {
      document.getElementById('account-list').style.display = 'none';
      document.getElementById('btn-show-other').style.display = 'none';
      document.getElementById('other-form').style.display = 'block';
    }

    function submitCustom(e) {
      e.preventDefault();
      const name = document.getElementById('custom-name').value;
      const email = document.getElementById('custom-email').value;
      const avatar = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=50&q=80'; // standard avatar
      selectAccount(name, email, avatar);
    }
  </script>
</body>
</html>
